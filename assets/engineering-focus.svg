<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1620" viewBox="0 0 1180 1620"><rect width="1180" height="1620" fill="#FFFFFF"/><g transform="translate(20 20)"><rect width="565" height="780" rx="18" fill="white" stroke="#BA99C8" stroke-width="2.3" stroke-dasharray="9 8"/><text x="28" y="55" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#594663">🎀 01 / 产品工程与前端开发 / Product &amp; Front-End Engineering</text><text x="28" y="114" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">I like approaching engineering problems from the</text><text x="28" y="143" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">product's point of view. Beyond implementing a page,</text><text x="28" y="172" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">I care about whether the flow is intuitive, the</text><text x="28" y="201" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">feature solves a genuine problem, and the code can</text><text x="28" y="230" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">support future iteration.</text><text x="28" y="278" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">I work with the React ecosystem and have experience</text><text x="28" y="307" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">in complex interactions, synchronized state, data</text><text x="28" y="336" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">visualization, and end-to-end web products. I enjoy</text><text x="28" y="365" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">combining engineering rigor with visual judgment.</text><path d="M28 668 H537" stroke="#E9DCEB"/><text x="28" y="707" font-family="Arial,sans-serif" font-size="16.4" fill="#80618D">React · TypeScript · JavaScript · HTML · CSS · Vite ·</text><text x="28" y="733" font-family="Arial,sans-serif" font-size="16.4" fill="#80618D">REST API · Responsive Design</text></g><g transform="translate(610 20)"><rect width="565" height="780" rx="18" fill="white" stroke="#BA99C8" stroke-width="2.3" stroke-dasharray="9 8"/><text x="28" y="55" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#594663">🤖 02 / AI Native 与 Agent Harness / AI-Native &amp; Agent Harness</text><text x="28" y="114" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">What first excited me about AI was its ability to</text><text x="28" y="143" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">turn previously unrealistic product ideas into</text><text x="28" y="172" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">something buildable.</text><text x="28" y="220" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">But after building agents, I learned that making a</text><text x="28" y="249" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">model answer a question and making an AI system</text><text x="28" y="278" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">execute tasks reliably are two very different</text><text x="28" y="307" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">challenges.</text><text x="28" y="355" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">I'm interested in connecting LLMs with business</text><text x="28" y="384" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">tools, retrieval, persistent memory, and real</text><text x="28" y="413" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">applications — building AI-native experiences that</text><text x="28" y="442" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">interpret requests, gather evidence, use tools, and</text><text x="28" y="471" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">maintain context.</text><text x="28" y="519" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">I also work on agent harness concerns such as</text><text x="28" y="548" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">execution boundaries, structured validation, failure</text><text x="28" y="577" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">recovery, error classification, tracing, evaluation,</text><text x="28" y="606" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">and regression testing.</text><text x="28" y="654" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">I want to build more than clever AI demos: I want to</text><text x="28" y="683" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">build systems people can actually depend on.</text><path d="M28 727 H537" stroke="#E9DCEB"/><text x="28" y="766" font-family="Arial,sans-serif" font-size="16.4" fill="#80618D">Python · FastAPI · LLM API · Tool Calling · AI Agent</text><text x="28" y="792" font-family="Arial,sans-serif" font-size="16.4" fill="#80618D">· RAG · Embedding · Vector Search · PostgreSQL /</text><text x="28" y="818" font-family="Arial,sans-serif" font-size="16.4" fill="#80618D">pgvector · Memory · Evaluation · Tracing</text></g><g transform="translate(20 824)"><rect width="565" height="780" rx="18" fill="white" stroke="#BA99C8" stroke-width="2.3" stroke-dasharray="9 8"/><text x="28" y="55" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#594663">🛠 03 / 全栈开发与系统工程 / Full-Stack &amp; Systems</text><text x="28" y="114" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">Although front-end and AI engineering are my current</text><text x="28" y="143" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">favorites, my experience extends beyond the browser.</text><text x="28" y="191" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">I've worked on Java backends, full-stack business</text><text x="28" y="220" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">applications, database design, message queues, and</text><text x="28" y="249" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">containerized environments.</text><text x="28" y="297" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">For WiseSpend, I independently connected the full</text><text x="28" y="326" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">application path across React, Spring Boot,</text><text x="28" y="355" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">PostgreSQL, and a Python AI service.</text><text x="28" y="403" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">I like understanding how a product works end to end</text><text x="28" y="432" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">— from interface to server and from APIs to</text><text x="28" y="461" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">persistent data — rather than only owning one</text><text x="28" y="490" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">isolated part.</text><path d="M28 668 H537" stroke="#E9DCEB"/><text x="28" y="707" font-family="Arial,sans-serif" font-size="16.4" fill="#80618D">Java · Spring Boot · Python · FastAPI · PostgreSQL ·</text><text x="28" y="733" font-family="Arial,sans-serif" font-size="16.4" fill="#80618D">SQL · Redis · RabbitMQ · Docker · REST API · Git</text></g><g transform="translate(610 824)"><rect width="565" height="780" rx="18" fill="white" stroke="#BA99C8" stroke-width="2.3" stroke-dasharray="9 8"/><text x="28" y="55" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#594663">🧊 04 / 3D Web 与 Blender 建模 / 3D Web &amp; Blender</text><text x="28" y="114" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">My interest in 3D started with a simple thought: it</text><text x="28" y="143" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">would be incredible to build the things I can</text><text x="28" y="172" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">imagine.</text><text x="28" y="220" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">From interactive Three.js experiences in the browser</text><text x="28" y="249" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">to architecture and scene modeling in Blender, I</text><text x="28" y="278" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">enjoy exploring the relationships between geometry,</text><text x="28" y="307" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">space, materials, and interaction.</text><text x="28" y="355" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">In the kitchen designer, I worked on parametric</text><text x="28" y="384" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">furniture, coordinate and dimension systems, spatial</text><text x="28" y="413" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">interaction, and synchronized design state.</text><text x="28" y="461" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">In Shantang Street, I explored how modeling and</text><text x="28" y="490" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">scene composition can express a place's spatial and</text><text x="28" y="519" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">cultural character.</text><text x="28" y="567" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">I'd love to keep exploring what becomes possible</text><text x="28" y="596" font-family="Arial,sans-serif" font-size="18.3" fill="#514E59">when 3D, the web, and AI meet.</text><path d="M28 668 H537" stroke="#E9DCEB"/><text x="28" y="707" font-family="Arial,sans-serif" font-size="16.4" fill="#80618D">Three.js · React Three Fiber · Blender · WebGL ·</text><text x="28" y="733" font-family="Arial,sans-serif" font-size="16.4" fill="#80618D">Procedural Geometry · 3D Modeling · Scene Composition</text></g></svg>